<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="النوتة — تطبيق إدارة العملاء والفواتير والأقساط">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="elnota">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>النوتة | التطبيق</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#00845b">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    let shortcutPrompt = null;
    window.addEventListener('beforeinstallprompt', event => {
      event.preventDefault();
      shortcutPrompt = event;
    });
    window.addEventListener('appinstalled', () => { shortcutPrompt = null; });
    window.elnotaInstallShortcut = async () => {
      if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
        return 'الاختصار مثبت بالفعل على هذا الجهاز.';
      }
      if (!shortcutPrompt) {
        return 'من قائمة المتصفح اختر إضافة إلى الشاشة الرئيسية أو تثبيت. على iPhone: Safari ← مشاركة ← إضافة إلى الشاشة الرئيسية.';
      }
      const prompt = shortcutPrompt;
      shortcutPrompt = null;
      await prompt.prompt();
      const choice = await prompt.userChoice;
      return choice.outcome === 'accepted' ? 'تم طلب تثبيت الاختصار.' : 'تم إلغاء تثبيت الاختصار.';
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
